name: CI
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: jdx/mise-action@v3
            - run: pnpm install --frozen-lockfile
            - run: just ready
            - run: just contracts && git diff --exit-code
