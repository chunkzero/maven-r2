name: CLI release
on:
    push:
        tags: ["v*"]
permissions:
    contents: write
jobs:
    binaries:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: jdx/mise-action@v3
            - run: go test ./...
            - name: Build standalone binaries
              shell: bash
              run: |
                  mkdir -p release
                  for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
                    os="${target%/*}"
                    arch="${target#*/}"
                    suffix=""
                    if [ "$os" = windows ]; then suffix=.exe; fi
                    CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "release/maven-r2-${os}-${arch}${suffix}" ./cli
                  done
                  cd release
                  sha256sum maven-r2-* > SHA256SUMS
            - run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
              env:
                  GH_TOKEN: ${{ github.token }}
